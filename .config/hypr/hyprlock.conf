general {
    hide_cursor = true
}

animations {
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = global, 0
    animation = inputFieldDots, 1, 1, smooth
}

background {
    path = screenshot
    blur_passes = 3
}

input-field {
    size = 600, 3.5%
    position = 0, -130
    rounding = 0
    outline_thickness = 3
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    font_color = rgb(ebdbb2)
    dots_spacing = 0.3
    check_color = rgb(d79921)
    fail_color = rgb(cc241d)
    capslock_color = rgb(b57614)
    placeholder_text =
    fail_text =
}

label {
    text = $TIME
    font_family = Input Mono
    font_size = 140
    color = rgb(ebdbb2)
}
